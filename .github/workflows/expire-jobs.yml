name: Expire Jobs

on:
  schedule:
    # Runs every hour — free on GitHub Actions (no Vercel Pro needed)
    - cron: "0 * * * *"
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  expire:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger expire-jobs endpoint
        run: |
          curl -f -s -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/expire-jobs"
