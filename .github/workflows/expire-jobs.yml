name: Expire Jobs

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  expire:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger expire-jobs endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://yapperagent.xyz/api/cron/expire-jobs")
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "expire-jobs returned HTTP $STATUS — failing workflow"
            exit 1
          fi
