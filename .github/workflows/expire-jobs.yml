name: Expire Jobs

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  expire:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger expire-jobs endpoint
        run: |
          curl -w "\nHTTP_STATUS:%{http_code}" -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/expire-jobs"
