[toolchain]
anchor_version = "0.32.1"

[features]
seeds = true
skip-lint = false

[programs.localnet]
yapper_escrow = "72PiBn2fvzj7iYDS5qxhgcTWVkyvwpxTj2e8sZKBgd6E"

[programs.devnet]
yapper_escrow = "72PiBn2fvzj7iYDS5qxhgcTWVkyvwpxTj2e8sZKBgd6E"

[programs.mainnet]
yapper_escrow = "72PiBn2fvzj7iYDS5qxhgcTWVkyvwpxTj2e8sZKBgd6E"

[registry]
